<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        .container {
            border: 3px solid #2c3e50;
            padding: 30px;
            width: 80%;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        .title {
            text-align: center;
            font-size: 20px;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #2c3e50;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            border: 1px solid #999;
            padding: 12px;
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 14px;
            color: #555;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>Product Information</h1>

        <div class="title">
            Product Details
        </div>

        <table>

            <tr>
                <th>Product Name</th>
                <td>{{ product.name }}</td>
            </tr>

            <tr>
                <th>Category</th>
                <td>{{ product.category }}</td>
            </tr>

            <tr>
                <th>Price</th>
                <td>₹ {{ product.price }}</td>
            </tr>

        </table>

        <div class="footer">
            <p>Generated by ProductInfoManager</p>
        </div>

    </div>

</body>

</html>
